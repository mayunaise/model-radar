name: Request Pages Rebuild

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: request-pages-rebuild
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=data-updated
